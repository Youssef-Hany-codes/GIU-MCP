    <path d="M44 20 V42"/>
    <path d="M34 33 L44 43 L54 33"/>
    <path d="M32 50 H56"/>
  </g>
  <text x="76" y="33" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Download for Claude Desktop</text>
  <text x="76" y="53" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#C9C9C9">giu-mcp.mcpb · Windows, macOS, Linux</text>
