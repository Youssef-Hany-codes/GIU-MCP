<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" width="420" height="72" role="img" aria-label="Download for Claude Desktop">
  <title>Download for Claude Desktop</title>
  <defs>
    <clipPath id="btn"><rect width="420" height="72" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#btn)">
    <rect width="420" height="72" fill="#1A1A1A"/>
    <!-- flag stripe, as on the app icon -->
    <rect y="66" width="140" height="6" fill="#1A1A1A"/>
    <rect x="140" y="66" width="140" height="6" fill="#DD0000"/>
    <rect x="280" y="66" width="140" height="6" fill="#FFCE00"/>
  </g>
  <!-- download arrow -->
