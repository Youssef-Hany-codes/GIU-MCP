[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "giu-mcp"
version = "0.1.0"
description = "MCP server for the GIU student portal and CMS"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.32",
    "requests-ntlm>=1.3",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "python-dotenv>=1",
    "pypdf>=5",
    "python-pptx>=1",
    "python-docx>=1.1",
    "keyring>=25",
]
keywords = ["mcp", "giu", "german international university", "student portal", "cms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/Youssef-Hany-codes/GIU-MCP"
Issues = "https://github.com/Youssef-Hany-codes/GIU-MCP/issues"

[project.scripts]
giu-mcp = "giu_mcp.cli:main"

[tool.setuptools]
packages = ["giu_mcp"]
